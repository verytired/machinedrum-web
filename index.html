<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MD-WEB 16</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div class="md">
  <div class="top">
    <div class="brand">MD&middot;WEB<small>16 TRACK DSP DRUM MACHINE</small></div>
    <div class="lcd" id="lcd" aria-live="polite">
      <div class="l1"><span id="ltrack"></span><button id="mprev" aria-label="previous machine">◀</button><span id="lmach"></span><button id="mnext" aria-label="next machine">▶</button><span id="lpat"></span><span id="lengine"></span></div>
      <div class="grid" id="lgrid"></div>
      <div class="l4" id="lstat"></div>
    </div>
    <div class="encs" id="encs"></div>
    <div class="side">
      <label>LEVEL<div class="enc big" id="level"></div></label>
      <label>TEMPO<span id="tempo"></span></label>
    </div>
  </div>
  <div class="mid">
    <div class="pages">
      <button class="key" data-page="0"><i></i>SYNTHESIS</button>
      <button class="key" data-page="1"><i></i>EFFECTS</button>
      <button class="key" data-page="2"><i></i>ROUTING</button>
      <button class="key" data-page="3"><i></i>ECHO</button>
      <button class="key" data-page="4"><i></i>GATE BOX</button>
    </div>
    <div class="hint">CLICK TRIG = ON/OFF &middot; HOLD TRIG + TURN = PARAMETER LOCK (MOUSE: DRAG OFF THE TRIG TO LATCH IT) &middot; DOUBLE-CLICK ENCODER = RESET &middot; DROP A WAV ON A TRACK KEY = ROM SAMPLE &middot; FACTORY SONGS: PICK ONE, THEN SONG + PLAY (?factory = FACTORY RESET)</div>
    <div class="transport">
      <select class="key" id="bank" title="pattern A01-H16 (while playing, the change waits for the end of the pattern)"></select>
      <button class="key" id="copy" title="copy this pattern">COPY</button>
      <button class="key" id="paste" title="paste the copied pattern over this one">PASTE</button>
      <button class="key" id="songkey" title="song mode: PLAY plays the song (again = pause), STOP holds, STOP twice = back to row 1"><i></i>SONG</button>
      <button class="key" id="export" title="save pattern, kit, tempo, effects and samples to a JSON file">EXPORT</button>
      <button class="key" id="syx" title="save kit, patterns, song and ROM samples as Machinedrum SysEx (.syx)">EXP SYX</button>
      <select class="key" id="pat" hidden title="pattern from the imported .syx (its kit comes with it)"></select>
      <select class="key" id="factory" title="load a factory song (replaces the kit, patterns, song and samples)"></select>
      <button class="key" id="import" title="load a file saved with EXPORT, or Machinedrum .syx files (kits, patterns, SDS samples; pick several at once)">IMPORT</button>
      <button class="key" id="load" title="load a WAV into this track (or drop one on a track key)">LOAD SMP</button>
      <button class="key" id="fxreset" title="RHYTHM ECHO and GATE BOX back to their defaults">RESET FX</button>
      <button class="key" id="clear">CLEAR TRK</button>
      <button class="key play" id="play" aria-label="play"><i></i>▶</button>
      <button class="key" id="stop" aria-label="stop">■</button>
    </div>
  </div>
  <div class="tracks" id="tracks"></div>
  <div class="trigs" id="trigs"></div>
  <div class="song" id="song" hidden></div>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
